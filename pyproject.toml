[project]
name = "automated-report-ppt-generation"
version = "0.1.0"
description = "Automated report platform"
authors = [
    {name = "cwru-yash",email = "yxm595@case.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "google-cloud-bigquery (>=3.41.0,<4.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "langgraph (>=1.2.1,<2.0.0)",
    "litellm (>=1.86.0,<2.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "weasyprint (>=68.1,<69.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "google-cloud-storage (>=3.10.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
